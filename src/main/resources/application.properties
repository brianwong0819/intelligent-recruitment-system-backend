# Spring Boot App Name
spring.application.name=Intelligent Event Recruitment System

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/fypdb
spring.datasource.username=postgres
spring.datasource.password=root

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=PHxWXyqQvwgJghMe9hEEL+gNDSTyI3Vd5bHnk+cmM3c=
jwt.expiration=3600000
jwt.refresh.expiration=86400000

# File Upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# File storage location
file.upload-dir=uploads/working_photos
file.comcard-upload-dir=uploads/comcards